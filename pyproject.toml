[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-spin-chain"
version = "0.1.0"
description = "Exact-diagonalization ETH diagnostics for finite spin-chain models"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Osamu Fukushima" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.setuptools]
py-modules = ["eth_spin_chain", "standard_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
